<!DOCTYPE html>
<html lang="en">

<head>
  <head th:replace="~{ head :: headFragment}"></head>

  <!--link scan.js-->
  <script src="scan.js"></script>
</head>

<body>
  <!--Navbar-->
    <!--<nav th:replace="~{ path::fragmentname}"></nav>-->
    <nav th:replace="~{ topnavbar :: topnavbarFragment}"></nav>
    <!--Navbar ends here-->
  <div class="container-fluid">
    <div class="row p-4">

    </div>

    <!-- title area starts here -->
    <div class="row p-3">
      <div class="col-12 p-3 d-flex justify-content-center div-title text-white">
        <i class="fa-solid fa-user-tie fa-2x"></i>
        <h2 class="h2 ms-3">Scan and Monitoring</h2>
      </div>
    </div>
    <!-- title area ends here -->


    <!-- toggle button starts -->
    <div class="row mt-2">
      <div class="col-1"></div>
      <div class="col-10 text-end">
        <a href="/consultation" class="btn btn-primary">
          Consultation Records Table
        </a>
      </div>
      <div class="col-1"></div>
    </div>
    <!-- toggle button ends here -->

    <div class="row mt-3">
      <div class="col-1"></div>
      <div class="col-10">
       <form onsubmit="return false;" id="formScan">
                <div class="card div-card">
                  <div class="card-body">
                    <!-- required mark -->
                    <div class="row mt-2">
                      <div class="col-12 text-end fw-bold">
                        <span class="text-danger">*</span> Required
                      </div>
                    </div>
                    <!-- required mark -->
                     <div class="row mt-2">
                     <!-- service starts here -->
                      <div class="col-4"></div>
                      <div class="col-4">
                        <div>
                          <label for="selectService" class="col-form-label fw-bold">
                            Select a Service : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <select name="service" required id="selectService" class="form-select form-input" onchange="selectDValidator(this,'','consultation','service_id'); filterAppointments();">
                            <option value="" selected disabled>
                              Select A Service
                            </option>
                            
                          </select>
                        </div>
                      </div> 
                      <div class="col-4"></div>
                      <!-- service ends here -->
                    </div>
                     <div class="row mt-2">
                      <div class="col-2"></div>
                      <div class="col-8">
                        <div>
                          <label for="selectAppNo" class="col-form-label fw-bold">
                            Select Channeling No + Owner : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-stethoscope"></i>
                          </span>

                          <select name="appoNo" required id="selectAppNo" disabled
                              class="form-select form-input" onchange="selectDValidator(this,'','consultation','appointment_id'); generateAppointmentOtherDetails();">
                              
                              <option value="" selected disabled>
                                Select Channeling No
                              </option>
                            </select>
                        </div>
                      </div>
                      <div class="col-2"></div>
                     </div>
                     <div class="row mt-2">
                      
                      <!-- date of consultation starts here -->
                      <div class="col-6">
                        <div>
                          <label for="dateOfConsultation" class="col-form-label fw-bold">
                            Date Of Consultation : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <input type="date" class="form-control" readonly required id="dateOfConsultation" onchange="textValidator(this, '^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','consultation','dateofconsultation')"/>
                        </div>
                      </div>
                      <!-- date of consultation ends here -->
                      <!--mobile starts here-->
                      <div class="col-6">
                        <div>
                          <label for="textMobile" class="col-form-label fw-bold">
                            Mobile : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-mobile"></i>
                          </span>

                          <input type="text" id="textMobile" class="form-control" placeholder="Enter Mobile" readonly
                            required onkeyup="textValidator(this,'^[0][7][01245678][0-9]{7}$','consultation','mobile')" />
                        </div>
                      </div>
                     </div>
                     
                    <div class="row mt-2">
                      <div class="col-3"></div>
                      <div class="col-6">
                        <div class="form-floating" style="margin-top: 16px;">
                          <textarea
                            name="textareaNote"
                            id="textNote"
                            cols="80"
                            rows="2"
                            class="form-control"
                            placeholder="Note"
                            onkeyup="textValidator(this,'','consultation','note')"
                          ></textarea>
                          <label for="" class="form-label fw-bold">
                            Medical Summary : <span class="text-danger">(optional)</span>
                          </label>
                        </div>
                      </div>
                      <div class="col-3"></div>
                    </div>

                    <div class="row mt-2">
                      <!-- clear button starts here-->
                      <div class="col-4">
                        <button type="reset" class="btn btn-danger rounded-1" id="btnScanReset">
                          <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                      </div>
                      <!-- clear button ends here -->

                      <div class="col-4"></div>

                      <!-- update & add button starts here -->
                      <div class="col-4 d-flex justify-content-center">
                        
                        <button type="submit" class="btn btn-success rounded-1" id="btnScanAdd" onclick="buttonFormSubmit()">
                          <i class="fa-solid fa-plus"></i> Submit
                        </button>
                      </div>
                      <!-- update & add button ends here -->
                    </div>
                  </div>
                </div>
              </form>
      </div>
      <div class="col-1"></div>
    </div>
  </div>

  
</body>

</html>
