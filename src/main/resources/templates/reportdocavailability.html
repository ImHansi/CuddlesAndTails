<!DOCTYPE html>
<html lang="en">
  <head>
    <head th:replace="~{ head :: headFragment}"></head>

    <!--link reportdocavailability.js-->
    <script src="reportdocavailability.js"></script>

    
  </head>



<body onload="setAppointmentDateRange()">
  <!--Navbar-->
    <!--<nav th:replace="~{ path::fragmentname}"></nav>-->
    <nav th:replace="~{ topnavbar :: topnavbarFragment}"></nav>
    <!--Navbar ends here-->
  <div class="container-fluid">
    <div class="row mt-3"></div>

    <!-- title area starts here -->
    <div class="row p-3" style="margin-top: 40px;">
      <div class="col-12 p-3 d-flex justify-content-center div-title text-white">
        <i class="fa-solid fa-user-tie fa-2x"></i>
        <h2 class="h2 ms-3">Doctor Availability Report</h2>
      </div>
    </div>
    <!-- title area ends here -->

    <div class="row mt-2">
      <div class="col-4"></div>
      <div class="col-4">
        
          <!-- date of appointment starts here -->
          <div class="col">
            <div>
              <label for="dateOfAppointment" class="col-form-label fw-bold">
                Date of Appointment : <span class="text-danger">*</span>
              </label>
            </div>
            <div>
              <input type="date" class="form-control" required id="dateOfAppointment"/>
            </div>
          </div>
          <!-- date of appointment ends here -->
           <!--service starts here-->
           <div class="col">
            <div>
              <label for="selectService" class="col-form-label fw-bold">
                Select a Service : <span class="text-danger">*</span>
              </label>
            </div>
            <div>
              <select name="service" required id="selectService" class="form-select form-input">
                <option value="" selected disabled>Select A Service</option>  
              </select>
            </div>
           </div>
           <!--service ends here-->
           <div class="col">
            <button type="button" class="btn btn-primary" style="margin-left: 250px; margin-top: 20px;" onclick="generateReport()">Generate</button>
          </div>
      </div>
      <div class="col-4"></div>
    </div>
          
  </div>
<!-- table area starts here -->

<div class="row mt-3">
  <div class="col-2"></div>
  <div class="col-8">

    <table class="table table-hover table-bordered table-striped border-primary" id="tableReportDocAvailability">
    <thead class="table-header">
      <tr>
        <th>#</th>
        <!-- #,No,Index -->
        <th>Doctor Name</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>No of Appointments</th>
        <th>Add</th>
      </tr>
    </thead>
    <tbody class="table-light">
      
    </tbody>
   </table>

  </div>
  <div class="col-2"></div>
</div>
<!-- table area ends here -->

<!-- appointment add model -->
  <div class="modal" id="appointmentAddModal" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title"> Add an appointment</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- form area start -->
          <div class="row mt-2">
            <div class="col-12">

              <form onsubmit="return false;" id="formAppointment">
                <div class="card div-card">
                  <div class="card-body">
                    <!-- required mark -->
                    <div class="row mt-2">
                      <div class="col-12 text-end fw-bold">
                        <span class="text-danger">*</span> Required
                      </div>
                    </div>
                    <!-- required mark -->

                    <!-- owner name starts here -->
                    <div class="row mt-2">
                      <div class="col-4">
                        <div>
                          <label
                            for="textOwnerName"
                            class="col-form-label fw-bold">
                            Owner : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <input type="text" placeholder="Enter Owner" id="textOwnerName" class="form-control" list="ownerList" onchange="dataListValidator(this,'appointment','owner_id');">
                          <datalist id="ownerList">
                            <option value="">
                          </datalist>
                        </div>

                      </div>

                      <!-- owner name ends here -->

                      <!-- Pet name starts here -->
                      <div class="col-4">
                        <div>
                          <label for="textPetName" class="col-form-label fw-bold">
                            Pet Name :
                            <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-dog"></i>
                          </span>

                          <select name="pet" required id="selectPet"
                              class="form-select form-input" disabled onchange="selectDValidator(this,'','appointment','pet_id')">
                              
                              <option value="" selected disabled>
                                Select Pet
                              </option>
                            </select>
                        </div>
                      </div>
                      <!-- Pet name ends here -->

                      <!-- mobile starts here -->
                      <div class="col-4">
                        <div>
                          <label for="textMobile" class="col-form-label fw-bold">
                            Mobile : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-mobile"></i>
                          </span>

                          <input type="text" id="textMobile" class="form-control" placeholder="Enter Mobile"
                            required onkeyup="textValidator(this,'^[0][7][01245678][0-9]{7}$','appointment','mobile')" />
                        </div>
                      </div>
                      <!-- mobile ends here -->
                    </div>

                    <div class="row mt-2">

                      <!-- date of appointment starts here -->
                      <div class="col-4">
                        <div>
                          <label for="dateOfAppointmentforForm" class="col-form-label fw-bold">
                            Date of Appointment : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <input type="date" class="form-control" required id="dateOfAppointmentforForm" onchange="textValidator(this, '^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','appointment','dateofappointment');"/>
                        </div>
                      </div>
                      <!-- date of appointment ends here -->
                       <!--service starts here-->
                       <div class="col-4">
                        <div>
                          <label for="selectServiceForm" class="col-form-label fw-bold">
                            Select a Service : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <select name="service" required id="selectServiceForm" class="form-select form-input" onchange="selectDValidator(this,'','appointment','service_id'); generateServiceFee();filterDoctors();">
                            <option value="" selected disabled>
                              Select A Service
                            </option>
                            
                          </select>
                        </div>
                        
                       </div>
                       <!--service ends here-->
                       <!-- service fee starts here -->
                      <div class="col-4">
                        <div>
                            <label for="textServiceFee" class="col-form-label fw-bold">
                                Service Fee : <span class="text-danger">*</span>
                            </label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">Rs :</span>
                            <input type="text" class="form-control" id="textServiceFee" placeholder="Enter service Fee" required readonly>
                           
                        </div>
                    </div>
                    <!-- service fee ends here -->
                    </div>

                    <div class="row mt-2">

                      <!-- doctor starts here -->
                      <div class="col-4">
                        <div>
                          <label for="selectDoctor" class="col-form-label fw-bold">
                            Select a Doctor : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <select name="doctor" required id="selectDoctor" class="form-select form-input" disabled onchange="selectDValidator(this,'','appointment','doctor_id'); filterTimeSlot();">
                            <option value="" selected disabled>
                              Select A Doctor
                            </option>
                            
                          </select>
                        </div>
                      </div>
                      <!-- doctor ends here -->

                      <!--start time here -->
                      <div class="col-4">
                        <div>
                          <label for="selectTime" class="col-form-label fw-bold">
                            Time slot :
                            <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div>
                          <select name="starttime" required id="selectStartTime"
                            class="form-select form-input" onchange="selectStartTimeValidator()">
                            <option value="" selected disabled>
                              Select a time
                            </option>
                            
                          </select>
                        </div>
                      </div>
                      <!-- time ends here -->
                      <!-- appointment status starts here -->
                        <div class="col-4">
                          <div>
                            <label
                              for="selectAppointmentStatus"
                              class="col-form-label fw-bold"
                            >
                              Appointment Status :
                              <span class="text-danger">*</span>
                            </label>
                          </div>
                          <div>
                            <select
                              name="appointmentStatus"
                              required
                              id="selectAppointmentStatus"
                              class="form-select form-input"
                              onchange="selectDValidator(this,'','appointment','appointmentstatus_id')">
                              <option value="" disabled>
                                Select Appointment Status
                              </option>
                            </select>
                          </div>
                        </div>
                        <!-- appointment status ends here -->
                    </div>

                    <div class="row mt-2">
                      <!-- clear button starts here-->
                      <div class="col-4">
                        <button type="reset" class="btn btn-danger rounded-1" id="btnAppointmnetReset">
                          <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                      </div>
                      <!-- clear button ends here -->

                      <div class="col-4"></div>

                      <!-- update & add button starts here -->
                      <div class="col-4 d-flex justify-content-center">
                        <button type="submit" class="btn btn-success rounded-1" id="btnAppointmentAdd" onclick="buttonFormSubmit()">
                          <i class="fa-solid fa-plus"></i> Submit
                        </button>
                      </div>
                      <!-- update & add button ends here -->
                    </div>
                  </div>
                </div>
              </form>
              <!-- form area ends -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
