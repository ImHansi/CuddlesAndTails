<!DOCTYPE html>
<html lang="en">
  <head>
    <head th:replace="~{ head :: headFragment}"></head>

    <!-- monthly payments report JS -->
    <script src="reportmonthlypayments.js"></script>
  </head>

  <body>
    <!-- Navbar -->
    <nav th:replace="~{ topnavbar :: topnavbarFragment}"></nav>

    <div class="container-fluid">
      <div class="row mt-3"></div>

      <!-- Title -->
      <div class="row p-3" style="margin-top: 40px;">
        <div class="col-12 p-3 d-flex justify-content-center div-title text-white">
          <i class="fa-solid fa-calendar-days fa-2x"></i>
          <h2 class="h2 ms-3">Monthly Payment Report</h2>
        </div>
      </div>

      <div class="row mt-2">
        <div class="col-4"></div>
        <div class="col-4">

          <!-- Month starts -->
          <div class="col mb-3">
            <label for="reportMonth" class="col-form-label fw-bold">Month : <span class="text-danger">*</span></label>
            <select id="reportMonth" class="form-control" required>
              <option value="" disabled selected>Select Month</option>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>

          <!-- Year starts -->
          <div class="col mb-3">
            <label for="reportYear" class="col-form-label fw-bold">Year : <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="reportYear" placeholder="Enter Year (e.g. 2025)" required>
          </div>

          <!-- Total starts -->
          <div class="col mb-3">
            <label for="textMonthlyTotal" class="col-form-label fw-bold">Total Amount :</label>
            <div class="input-group">
              <span class="input-group-text fw-bold">Rs :</span>
              <input type="text" class="form-control" id="textMonthlyTotal" placeholder="Total Fee" readonly>
            </div>
          </div>

          <!-- Button starts-->
          <div class="col">
            <button type="button" class="btn btn-primary" style="margin-left: 250px; margin-top: 20px;" onclick="generateMonthlyReport()">Generate</button>
          </div>

        </div>
        <div class="col-4"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="row mt-3">
      <div class="col-2"></div>
      <div class="col-8">
        <table class="table table-hover table-bordered table-striped border-primary" id="tableReportMonthlyPayments">
          <thead class="table-header">
            <tr>
              <th>#</th>
              <th>Payment No</th>
              <th>Owner</th>
              <th>Total Amount</th>
              <th>Paid Amount</th>
              <th>Balance Amount</th>
            </tr>
          </thead>
          <tbody class="table-light"></tbody>
        </table>
      </div>
      <div class="col-2"></div>
    </div>
  </body>
</html>
