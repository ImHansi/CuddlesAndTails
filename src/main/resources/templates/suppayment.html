<!DOCTYPE html>
<html lang="en">
  <head>
  
    <head th:replace="~{ head :: headFragment}"></head>
  
    <!--link suppayment.js-->
    <script src="suppayment.js"></script>
    <script>
      //to reset the form after clicking on the X mark
     document.addEventListener("DOMContentLoaded", function(){
      var suppaymentAddModal = document.getElementById('suppaymentAddModal');
      var formSuppayment = document.getElementById('formSuppayment')
  
      suppaymentAddModal.addEventListener('hidden.bs.modal', function(){
        formSuppayment.reset();
      });
     });
   </script>
  
  </head>

<body>

  <!--Navbar-->
    <!--<nav th:replace="~{ path::fragmentname}"></nav>-->
    <nav th:replace="~{ topnavbar :: topnavbarFragment}"></nav>
    <!--Navbar ends here-->
  <div class="container-fluid">
    <div class="row p-4">

    </div>

    <!-- title area starts here -->
    <div class="row p-3">
      <div class="col-12 p-3 d-flex justify-content-center div-title text-white">
        <i class="fa-solid fa-user-tie fa-2x"></i>
        <h2 class="h2 ms-3">Supplier Payment Management</h2>
      </div>
    </div>
    <!-- title area ends here -->


    <!-- toggle button starts -->
    <div class="row mt-2">
      <div class="col-1"></div>
      <div class="col-10 text-end">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#suppaymentAddModal">
          Add A payment Record
        </button>
      </div>
      <div class="col-1"></div>
    </div>
    <!-- toggle button ends here -->

    <div class="row mt-3">
      <div class="col-1"></div>
      <div class="col-10">
        <div class="card div-card">
          <div class="card-body">
            <!-- table area starts here -->

            <div class="row mt-3">
              <table class="table table-hover table-bordered table-striped border-primary" id="tableSuppayment">
                <thead class="table-header">
                  <tr>
                    <th>#</th>
                    <!-- #,No,Index -->
                    <th>Supplier Name</th>
                    <th>Total Amount</th>
                    <th>Paid Amount</th>
                    <th>Balance</th>
                    <th>Bill No</th>
                    <th>Modify</th>
                  </tr>
                </thead>
                <tbody class="table-light">
                  
                </tbody>
              </table>
            </div>
            <!-- table area ends here -->
          </div>
        </div>
      </div>
      <div class="col-1"></div>
    </div>
  </div>

  <!-- supplier payment add model -->
  <div class="modal" id="suppaymentAddModal" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title"> Add a payment</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- form area start -->
          <div class="row mt-2">
            <div class="col-12">

              <form onsubmit="return false;" id="formSuppayment">
                <div class="card div-card">
                  <div class="card-body">
                    <!-- required mark -->
                    <div class="row mt-2">
                      <div class="col-12 text-end fw-bold">
                        <span class="text-danger">*</span> Required
                      </div>
                    </div>
                    <!-- required mark -->

                    <div class="row mt-2">
                      <div class="col-4"></div>
                      <div class="col-4">
                        <div>
                          <label for="selectSupplierName" class="col-form-label fw-bold">
                            Supplier Name : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                          </span>

                          <select name="supplier" required id="selectSupplierName"
                              class="form-select form-input" onchange="selectDValidator(this,'','supplier','supplier_id');">
                              
                              <option value="" selected disabled>
                                Select Supplier
                              </option>
                            </select>
                        </div>
                      </div>
                      <div class="col-4"></div>
                     </div>
                     <!--receive note select starts here-->
                     <div class="row mt-2">
                        <div class="col-4"></div>
                        <div class="col-4">
                            <div class="col-4">
                        <div>
                          <label for="selectReceiveNote" class="col-form-label fw-bold">
                            Receive Note : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                          </span>

                          <select name="receivenote" required id="selectReceiveNote"
                              class="form-select form-input" onchange="selectDValidator(this,'','receive','receive_id');">
                              
                              <option value="" selected disabled>
                                Select Receive Note
                              </option>
                            </select>
                        </div>
                      </div>
                        </div>
                        <div class="col-4"></div>
                     </div>
                     <!--receive note select ends here-->

                     <div class="row mt-2">
                      <!-- total fee starts here -->
                      <div class="col-4">
                        <div>
                            <label for="textTotalAmount" class="col-form-label fw-bold">
                                Total Amount : <span class="text-danger"></span>
                            </label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">Rs :</span>
                            <input type="text" class="form-control" id="textTotalAmount" placeholder="Total Amount" readonly >
                            <span class="input-group-text">.00</span>
                        </div>
                    </div>
                    <!-- total fee ends here -->
                     <!-- paid fee starts here -->
                     <div class="col-4">
                      <div>
                          <label for="textPaidAmount" class="col-form-label fw-bold">
                              Paid Amount : <span class="text-danger"></span>
                          </label>
                      </div>
                      <div class="input-group">
                          <span class="input-group-text fw-bold">Rs :</span>
                          <input type="text" class="form-control" id="textPaidAmount" placeholder="Paid Amount" readonly >
                          <span class="input-group-text">.00</span>
                      </div>
                  </div>
                  <!-- paid fee ends here -->
                   <!-- balance fee starts here -->
                   <div class="col-4">
                    <div>
                        <label for="textBalanceAmount" class="col-form-label fw-bold">
                            Balance Amount : <span class="text-danger"></span>
                        </label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text fw-bold">Rs :</span>
                        <input type="text" class="form-control" id="textBalanceAmount" placeholder="Balance Amount" readonly >
                        <span class="input-group-text">.00</span>
                    </div>
                </div>
                <!-- balance fee ends here -->
                     </div>

                     <div class="row mt-2">
                      <div class="col-4"></div>
                      <div class="col-4">
                        <div>
                          <label for="selectMethod" class="col-form-label fw-bold">
                            Payment Method : <span class="text-danger">*</span>
                          </label>
                        </div>
                        <div class="input-group">
                          <span class="input-group-text">
                            <i class="fa-regular fa-credit-card"></i>
                          </span>

                          <select name="method" required id="selectMethod"
                              class="form-select form-input" onchange="selectDValidator(this,'','supplierpayment','paymentm')">
                              
                              <option value="" selected disabled>
                                Select payment method
                              </option>
                            </select>
                        </div>
                      </div>
                      <div class="col-4"></div>
                     </div>

                     <div class="row mt-2">
                      <!--total amount-->
                      <div class="col-4">
                        <div class="d-flex justify-content-center">
                          
                          <button type="submit" class="btn btn-primary rounded-1" onclick="generateTotalFee()">Calculate Total Amount</button>
                      </div>
                      <div class="input-group">
                          <span class="input-group-text fw-bold">Rs :</span>
                          <input type="text" class="form-control" id="textTotalFee" placeholder="Click on the button" readonly required>
                          <span class="input-group-text">.00</span>
                      </div>
                      </div>
                      <!--paid amount-->
                      <div class="col-4">
                        <div>
                          <label for="textPaidFee" class="col-form-label fw-bold">
                              Paid Amount : <span class="text-danger">*</span>
                          </label>
                          
                      </div>
                      <div class="input-group">
                          <span class="input-group-text fw-bold">Rs :</span>
                          <input type="text" class="form-control" id="textPaidFee" placeholder="Enter paid amount" required>
                          <span class="input-group-text">.00</span>
                      </div>
                      </div>
                      <!--balance-->
                      <div class="col-4">
                        <div class="d-flex justify-content-center">
                          
                          <button type="submit" class="btn btn-primary rounded-1" onclick="generateBalance()">Calculate Balance</button>
                      </div>
                      <div class="input-group">
                          <span class="input-group-text fw-bold">Rs :</span>
                          <input type="text" class="form-control" id="textBalanceFee" placeholder="Click on the button" readonly required>
                          <span class="input-group-text">.00</span>
                      </div>
                      </div>
                     </div>


                    <div class="row mt-2">
                      <!-- clear button starts here-->
                      <div class="col-4">
                        <button type="reset" class="btn btn-danger rounded-1" id="btnPaymentReset">
                          <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                      </div>
                      <!-- clear button ends here -->

                      <div class="col-4"></div>

                      <!-- update & add button starts here -->
                      <div class="col-4 d-flex justify-content-center">
                        <button disabled type="submit" class="btn btn-warning text-white rounded-1" id="btnPaymentUpdate">
                          <i class="fa-solid fa-arrows-rotate"></i> Update
                        </button>
                        <button type="submit" class="btn btn-success rounded-1" id="btnPaymentAdd">
                          <i class="fa-solid fa-plus"></i> Submit
                        </button>
                      </div>
                      <!-- update & add button ends here -->
                    </div>
                  </div>
                </div>
              </form>
              <!-- form area ends -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
